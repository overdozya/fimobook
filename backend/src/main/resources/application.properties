spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# MariaDB connection. Override these defaults with environment variables.
spring.datasource.url=${FIMO_DB_URL:jdbc:mariadb://localhost:3306/fimobook}
spring.datasource.username=${FIMO_DB_USERNAME:fimobook}
spring.datasource.password=${FIMO_DB_PASSWORD:fimobook-local}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Compose initializes a fresh database with schema-mariadb.sql. Disable Spring's
# separate SQL initializer so the schema has a single owner in local development.
spring.sql.init.mode=never

# Import is an explicit maintenance command and never runs during normal API startup.
fimo.players.import-enabled=${FIMO_PLAYERS_IMPORT_ENABLED:false}
fimo.players.import-path=${FIMO_PLAYERS_IMPORT_PATH:}

# Collected FC Mobile assets are served through the API in local development.
# Production replaces this directory with object storage/CDN delivery.
fimo.assets.local-dir=${FIMO_ASSETS_LOCAL_DIR:../data/fcmobile/assets/files}
fimo.assets.card-colors-path=${FIMO_CARD_COLORS_PATH:../data/fcmobile/assets/files/fco.vod.nexoncdn.co.kr/jade_assets_stage_bQ4IlcltxH6c8s5/card_colors/card_colors.json}

# Development-only JWT defaults. Override both values outside local development.
fimo.jwt.secret=${FIMO_JWT_SECRET:fimobook-local-development-secret-change-me}
fimo.jwt.expiration-seconds=${FIMO_JWT_EXPIRATION_SECONDS:3600}
fimo.jwt.refresh-expiration-days=${FIMO_JWT_REFRESH_EXPIRATION_DAYS:30}

# Detail requests always return MariaDB data immediately. A stale tradeable
# card only enqueues one pid-level SquadMaker refresh in the background.
fimo.price-refresh.enabled=${FIMO_PRICE_REFRESH_ENABLED:true}
fimo.price-refresh.cache-hours=${FIMO_PRICE_REFRESH_CACHE_HOURS:3}
fimo.price-refresh.poll-delay-ms=${FIMO_PRICE_REFRESH_POLL_DELAY_MS:500}
fimo.price-refresh.request-timeout-seconds=${FIMO_PRICE_REFRESH_TIMEOUT_SECONDS:15}
fimo.price-refresh.lock-timeout-seconds=${FIMO_PRICE_REFRESH_LOCK_TIMEOUT_SECONDS:60}
