spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# MariaDB connection. Override these defaults with environment variables.
spring.datasource.url=${FIMO_DB_URL:jdbc:mariadb://localhost:3306/fimobook}
spring.datasource.username=${FIMO_DB_USERNAME:fimobook}
spring.datasource.password=${FIMO_DB_PASSWORD:fimobook-local}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Compose initializes a fresh database with schema-mariadb.sql. Disable Spring's
# separate SQL initializer so the schema has a single owner in local development.
spring.sql.init.mode=never

# Development-only JWT defaults. Override both values outside local development.
fimo.jwt.secret=${FIMO_JWT_SECRET:fimobook-local-development-secret-change-me}
fimo.jwt.expiration-seconds=${FIMO_JWT_EXPIRATION_SECONDS:86400}
